name: build
run-name: ${{ github.actor }} is running tests
on:
  push:
    branches:
      - tmp
jobs:
  execute-tests-ubuntu22:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.ref_name }}

    - name: Setup OCaml
      uses: ocaml/setup-ocaml@v3
      with:
        ocaml-compiler: 5.3.0
        opam-disable-sandboxing: true
    - run: opam install -y ppx_deriving ocamlfind batteries

    - name: Install apt requirements
      run: install/install_apt.intel.sh

    - name: Test
      run: |
        find $(pwd)/src/points -maxdepth 1 ! -name '.gitignore' -type f -exec rm -v {} +
        $(pwd)/test/test_action.sh

  execute-coreutils-ubuntu22:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.ref_name }}

    - name: Setup OCaml
      uses: ocaml/setup-ocaml@v3
      with:
        ocaml-compiler: 5.3.0
        opam-disable-sandboxing: true
    - run: opam install -y ppx_deriving ocamlfind batteries

    - name: Install apt requirements
      run: install/install_apt.intel.sh

    - name: Install coreutils
      run: install/install_coreutils.intel.sh

    - name: Test
      run: |
        find $(pwd)/src/points -maxdepth 1 ! -name '.gitignore' -type f -exec rm -v {} +
        $(pwd)/test/test_coreutils.sh


  execute-tests-ubuntu24:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.ref_name }}

    - name: Setup OCaml
      uses: ocaml/setup-ocaml@v3
      with:
        ocaml-compiler: 5.3.0
        opam-disable-sandboxing: true
    - run: opam install -y ppx_deriving ocamlfind batteries

    - name: Install apt requirements
      run: install/install_apt.intel.sh

    - name: Test
      run: |
        find $(pwd)/src/points -maxdepth 1 ! -name '.gitignore' -type f -exec rm -v {} +
        $(pwd)/test/test_action.sh

  execute-coreutils-ubuntu24:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.ref_name }}

    - name: Setup OCaml
      uses: ocaml/setup-ocaml@v3
      with:
        ocaml-compiler: 5.3.0
        opam-disable-sandboxing: true
    - run: opam install -y ppx_deriving ocamlfind batteries

    - name: Install apt requirements
      run: install/install_apt.intel.sh

    - name: Install coreutils
      run: install/install_coreutils.intel.sh

    - name: Test
      run: |
        find $(pwd)/src/points -maxdepth 1 ! -name '.gitignore' -type f -exec rm -v {} +
        $(pwd)/test/test_coreutils.sh

  execute-instrument-tests:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.ref_name }}

    - name: Setup OCaml
      uses: ocaml/setup-ocaml@v3
      with:
        ocaml-compiler: 5.3.0
        opam-disable-sandboxing: true
    - run: opam install -y ppx_deriving ocamlfind batteries

    - name: Install apt requirements
      run: install/install_apt.intel.sh

    - name: Instrument Test
      run: |
        $(pwd)/test/test_all.py -a -c
        $(pwd)/test/test_instrument.intel.sh

  execute-instrument-tests-arm-thumb:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.ref_name }}

    - name: Setup OCaml
      uses: ocaml/setup-ocaml@v3
      with:
        ocaml-compiler: 5.3.0
        opam-disable-sandboxing: true
    - run: opam install -y ppx_deriving ocamlfind batteries

    - name: Install apt requirements
      run: install/install_apt.arm.sh

    - name: Instrument Test
      run: |
        $(pwd)/test/test_all.py -a -c --arch arm
        $(pwd)/test/test_instrument.arm.thumb.sh

  execute-instrument-tests-arm64:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.ref_name }}

    - name: Setup OCaml
      uses: ocaml/setup-ocaml@v3
      with:
        ocaml-compiler: 5.3.0
        opam-disable-sandboxing: true
    - run: opam install -y ppx_deriving ocamlfind batteries

    - name: Install apt requirements
      run: install/install_apt.arm.sh

    - name: Instrument Test
      run: |
        $(pwd)/test/test_all.py -a -c --arch arm
        $(pwd)/test/test_instrument.arm.64.sh
